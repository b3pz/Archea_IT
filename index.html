<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archea Service Desk</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast" class="toast hidden"></div>

<section id="login" class="login">
  <div class="card login-card">
    <div class="logo">A</div>
    <h1>Archea Service Desk</h1>
    <p>Portale interno IT</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required></label>
      <label>Password<input id="password" type="password" required></label>
      <button>Accedi</button>
    </form>
    <div id="loginErr" class="err"></div>
  </div>
</section>

<section id="app" class="app hidden">
  <aside>
    <div>
      <div class="brand"><div class="logo small">A</div><b>Archea<br><span>Service Desk</span></b></div>
      <nav>
        <button data-view="home">Dashboard</button>
        <button data-view="new">Nuovo ticket</button>
        <button data-view="mine">I miei ticket</button>
        <button data-view="movimenti">Movimenti</button>
        <button data-view="prenotazioni">Prenotazioni</button>
        <button data-view="censimento">Censimento</button>
        <button id="itNav" data-view="it" class="hidden">Gestione IT</button>
      </nav>
    </div>
    <div class="account"><b id="who"></b><span id="role"></span><button id="logout" class="ghost">Esci</button></div>
  </aside>
  <main>
    <header><div><h2 id="title">Dashboard</h2><p id="subtitle"></p></div></header>
    <div id="content"></div>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body></html>
