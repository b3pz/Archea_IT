<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archea Service Desk</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast" class="toast hidden"></div>

<section id="login" class="login">
  <div class="login-wrap">
    <img src="logo_archea.png" class="login-logo" alt="Archea Associati">
    <div class="login-card">
      <h1>Service Desk</h1>
      <p>Portale interno IT</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="primary">Accedi</button>
      </form>
      <div id="loginErr" class="err"></div>
    </div>
  </div>
</section>

<section id="app" class="app hidden">
  <aside class="sidebar">
    <div>
      <div class="brand">
        <img src="logo_archea.png" alt="Archea Associati">
        <span>Service Desk</span>
      </div>

      <nav id="userNav" class="hidden">
        <button data-view="new">Apri ticket</button>
        <button data-view="mine">I miei ticket</button>
      </nav>

      <nav id="hrNav" class="hidden">
        <button data-view="new">Apri ticket</button>
        <button data-view="mine">I miei ticket</button>
        <button data-view="hr-new">Nuovo movimento</button>
        <button data-view="hr-history">Storico movimenti</button>
        <button data-view="hr-stats">Statistiche HR</button>
      </nav>

      <nav id="itNav" class="hidden">
        <button data-view="home">Dashboard</button>
        <button data-view="new">Nuovo ticket</button>
        <button data-view="it">Gestione IT</button>
        <button data-view="calendar">Calendario</button>
        <button data-view="movimenti">Movimenti</button>
        <button data-view="prenotazioni">Prenotazioni</button>
        <button data-view="censimento">Censimento</button>
      </nav>
    </div>

    <div class="account">
      <b id="who"></b>
      <span id="role"></span>
      <button id="logout" class="ghost">Esci</button>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h2 id="title"></h2>
        <p id="subtitle"></p>
      </div>

      <div class="notification-wrap">
        <button id="bellBtn" class="bell" aria-label="Notifiche">
          <span class="bell-icon">●</span>
          <span id="bellCount" class="bell-count hidden">0</span>
        </button>
        <div id="notificationPanel" class="notification-panel hidden">
          <div class="notification-head">
            <strong>Notifiche</strong>
            <button id="markAllRead" class="text-btn">Segna tutte lette</button>
          </div>
          <div id="notificationList"></div>
        </div>
      </div>
    </header>

    <div id="content"></div>
  </main>
</section>

<script src="app.js"></script>
</body>
</html>
